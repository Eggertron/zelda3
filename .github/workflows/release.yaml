name: Build

on:
  push:
    branches:
    - master
    tags:
    - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: Linux
          os: ubuntu-latest
        - name: Mac
          os: macos-latest
        - name: Windows
          os: windows-latest
    steps:
    - uses: actions/checkout@v3

    - uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies for Linux
      if: ${{ matrix.name == 'Linux' }}
      run: |
        sudo apt update
        sudo apt install -y libsdl2-dev

    - name: Install dependencies for Mac
      if: ${{ matrix.name == 'Mac' }}
      run: |
        brew install sdl2 coreutils

    - name: Setup MSYS2 for Windows
      if: ${{ matrix.name == 'Windows' }}
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: make mingw-w64-x86_64-gcc mingw-w64-x86_64-SDL2

    - name: Build (Linux / Mac)
      if: ${{ matrix.name != 'Windows' }}
      run: make -j$(nproc) zelda3

    - name: Build (Windows)
      if: ${{ matrix.name == 'Windows' }}
      shell: msys2 {0}
      run: make -j$(nproc) zelda3

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: zelda3-${{ matrix.name }}
        path: |
          zelda3
          zelda3.exe
          zelda3_assets.dat

  release:
    name: Create Release & Deploy
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - name: Download all workflow artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/zelda3-Linux/*
          artifacts/zelda3-Mac/*
          artifacts/zelda3-Windows/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
